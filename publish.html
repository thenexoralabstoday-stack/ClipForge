<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publish — ClipForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main id="page">
  <div class="page-head"><div><h1>Publish</h1><p>Send rendered clips to the platforms you’ve connected. Each upload is logged here.</p></div></div>

  <div class="panel">
    <div class="panel__head"><div><h2>Destinations</h2><p>Manage accounts in <a class="link" href="/settings.html#connections">Settings → Connections</a>.</p></div></div>
    <div class="panel__body"><div class="row" id="accounts"></div></div>
  </div>

  <div class="panel" id="picker">
    <div class="panel__head"><div><h2>Project</h2><p>Choose which project’s clips to publish.</p></div></div>
    <div class="panel__body"><div class="row"><select class="select" id="projectSelect" style="max-width:420px"></select></div></div>
  </div>

  <section class="panel">
    <div class="panel__head"><div><h2>Clips</h2><p id="clipsSub">Only rendered clips can be published.</p></div><button class="btn btn--primary" id="publishAll" hidden>Publish all rendered</button></div>
    <div class="list" id="clips"><div class="empty small">Pick a project above.</div></div>
  </section>
</main>

<script src="/app/app.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  let projectId = q.get('project'); const jobId = q.get('job');
  const shell = CF.mount({ active: 'publish', title: 'Publish' });
  if (!shell) return;
  const $ = id => document.getElementById(id);
  const PLATFORMS = ['youtube', 'tiktok', 'instagram'];
  let social = {}, clips = [];

  async function loadSocial() {
    try { social = (await CF.api('/auth/social')).social || {}; } catch { social = {}; }
    $('accounts').innerHTML = PLATFORMS.map(p => `<span class="badge ${social[p] ? 'badge--ok' : ''}">${p}${social[p] ? '' : ' · off'}</span>`).join('') +
      (PLATFORMS.some(p => social[p]) ? '' : '<a class="btn btn--sm" href="/settings.html#connections" style="margin-left:auto">Connect an account</a>');
  }

  async function loadProjects() {
    const { projects } = await CF.api('/projects');
    const sel = $('projectSelect');
    sel.innerHTML = '<option value="">Select a project…</option>' + projects.map(p => `<option value="${CF.esc(p.id)}" ${p.id === projectId ? 'selected' : ''}>${CF.esc(p.name)} · ${p.rendersCount || 0} rendered</option>`).join('');
    sel.onchange = () => { projectId = sel.value; history.replaceState({}, '', projectId ? `?project=${encodeURIComponent(projectId)}` : location.pathname); loadClips(); };
  }

  async function loadClips() {
    if (jobId) return loadLegacy();
    if (!projectId) { $('clips').innerHTML = '<div class="empty small">Pick a project above.</div>'; $('publishAll').hidden = true; return; }
    try {
      clips = (await CF.api(`/projects/${projectId}/clips`)).clips || [];
      const ready = clips.filter(c => c.renderStatus === 'done');
      $('clipsSub').textContent = `${ready.length} of ${clips.length} clips rendered`;
      $('publishAll').hidden = !ready.length;
      if (!clips.length) { $('clips').innerHTML = `<div class="empty"><h3>No clips in this project</h3><a class="btn" href="/project.html?id=${encodeURIComponent(projectId)}">Open project</a></div>`; return; }
      $('clips').innerHTML = clips.map((c, i) => `
        <div class="clip" data-id="${CF.esc(c.id)}">
          <div class="clip__thumb">${c.renderPath ? `<video src="${CF.esc(c.renderPath)}" preload="metadata" muted playsinline></video>` : '<svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"/></svg>'}</div>
          <div>
            <div class="clip__title">${CF.esc(c.title || 'Clip ' + (i + 1))}</div>
            <div class="clip__hook">${CF.esc(c.hook || '')}</div>
            <div class="clip__meta"><span class="mono muted">${CF.fmt.secs(c.start)} → ${CF.fmt.secs(c.end)}</span>${CF.badge(c.renderStatus || 'pending')}${(c.publishResults || []).map(r => `<span class="badge ${r.status === 'published' ? 'badge--ok' : r.status === 'failed' ? 'badge--bad' : ''}">${CF.esc(r.platform)} ${CF.esc(r.status)}</span>`).join('')}</div>
            <div class="row" style="margin-top:10px">${PLATFORMS.map(p => `<label class="check" style="align-items:center"><input type="checkbox" data-p="${p}" ${social[p] ? 'checked' : 'disabled'}><span>${CF.fmt.title(p)}</span></label>`).join('')}</div>
          </div>
          <div class="clip__side"><button class="btn btn--primary btn--sm" data-publish="${CF.esc(c.id)}" ${c.renderStatus === 'done' ? '' : 'disabled title="Render this clip first"'}>Publish</button></div>
        </div>`).join('');
      $('clips').querySelectorAll('[data-publish]').forEach(b => b.onclick = () => publishOne(b.dataset.publish, b));
    } catch (e) { $('clips').innerHTML = `<div class="empty small">${CF.esc(e.message)}</div>`; }
  }

  async function publishOne(id, btn) {
    const row = btn.closest('.clip'); const c = clips.find(x => x.id === id);
    const platforms = [...row.querySelectorAll('input[data-p]:checked')].map(i => i.dataset.p);
    if (!platforms.length) return CF.toast('Choose at least one connected platform', 'error');
    CF.busy(btn, true);
    try {
      const { results } = await CF.api(`/clips/${id}/publish`, { method: 'POST', body: JSON.stringify({ platforms, title: c.title, description: c.caption || c.hook, hashtags: c.hashtags || [] }) });
      c.publishResults = results;
      const ok = results.filter(r => r.status === 'published').length;
      CF.toast(ok ? `Published to ${ok} platform${ok === 1 ? '' : 's'}` : (results[0]?.error || 'Nothing was published'), ok ? 'success' : 'error', 6000);
      loadClips();
    } catch (e) { CF.toast(e.message, 'error', 6000); CF.busy(btn, false); }
  }
  $('publishAll').onclick = async () => {
    const platforms = PLATFORMS.filter(p => social[p]);
    if (!platforms.length) return CF.toast('Connect a platform first', 'error');
    if (!await CF.confirm(`Publish every rendered clip to ${platforms.map(CF.fmt.title).join(', ')}?`, { label: 'Publish all', kind: 'primary', title: 'Publish all rendered clips' })) return;
    for (const b of $('clips').querySelectorAll('[data-publish]:not([disabled])')) await publishOne(b.dataset.publish, b);
  };

  /* Legacy one-shot jobs (Quick forge output) publish through the older endpoint. */
  async function loadLegacy() {
    $('picker').hidden = true;
    try {
      clips = (await CF.api(`/clips/${jobId}`)).clips || [];
      $('clipsSub').textContent = `Job ${jobId} · ${clips.length} clips`;
      $('clips').innerHTML = clips.map((c, i) => `
        <div class="clip"><div class="clip__thumb"><video src="${CF.esc(c.url || `/output/${jobId}/clips/clip-${String(i + 1).padStart(2, '0')}.mp4`)}" preload="metadata" muted playsinline></video></div>
        <div><div class="clip__title">${CF.esc(c.title || 'Clip ' + (i + 1))}</div><div class="clip__hook">${CF.esc(c.hook || '')}</div><div class="clip__meta"><span class="mono muted">${CF.fmt.secs(c.start)} → ${CF.fmt.secs(c.end)}</span></div></div>
        <div class="clip__side"><div class="item__actions">${PLATFORMS.map(p => `<button class="btn btn--sm" data-legacy="${i}" data-p="${p}" ${social[p] ? '' : 'disabled'}>${CF.fmt.title(p)}</button>`).join('')}</div></div></div>`).join('');
      $('clips').querySelectorAll('[data-legacy]').forEach(b => b.onclick = async () => {
        const c = clips[+b.dataset.legacy]; CF.busy(b, true);
        try { await CF.api('/publish', { method: 'POST', body: JSON.stringify({ clipPath: c.url || `/output/${jobId}/clips/clip-${String(+b.dataset.legacy + 1).padStart(2, '0')}.mp4`, platform: b.dataset.p, metadata: { title: c.title, caption: c.caption, hashtags: c.hashtags || [] } }) }); CF.toast(`Published to ${b.dataset.p}`, 'success'); }
        catch (e) { CF.toast(e.message, 'error', 6000); } finally { CF.busy(b, false); }
      });
    } catch (e) { $('clips').innerHTML = `<div class="empty small">${CF.esc(e.message)}</div>`; }
  }

  await loadSocial();
  if (!jobId) await loadProjects().catch(e => CF.toast(e.message, 'error'));
  loadClips();
})();
</script>
</body>
</html>
