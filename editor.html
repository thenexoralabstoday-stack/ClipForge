<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="clipforge-api-base" content="/api">
<title>ClipForge — Clip Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #06040a;
    --bg2: #0d0806;
    --panel: #1a0f0a;
    --panel2: #241610;
    --text: #f5ebe0;
    --text2: #d4c4b5;
    --muted: #8a7a6e;
    --fire: #ff3d00;
    --fire2: #ff6a00;
    --fire3: #ff9d00;
    --fire4: #ffd166;
    --border: rgba(255, 255, 255, 0.055);
    --border2: rgba(255, 255, 255, 0.09);
    --gradient: linear-gradient(135deg, #ff3d00 0%, #ff6a00 100%);
    --gradient2: linear-gradient(135deg, #ff6a00 0%, #ff9d00 100%);
    --success: #10b981;
    --error: #ef4444;
    --radius: 12px;
    --shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Grain overlay */
  .app-grain {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(6, 4, 10, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--gradient);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: white;
    font-weight: 800;
  }

  h1 { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }

  .header-actions {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .container {
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .status {
    padding: 1rem 1.25rem;
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
    color: var(--text2);
  }

  .clips-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .clip-card {
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.3s;
  }

  .clip-card:hover {
    border-color: var(--fire2);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(255, 61, 0, 0.1);
  }

  .clip-thumb {
    width: 100%;
    aspect-ratio: 9/16;
    object-fit: cover;
    background: #000;
    display: block;
  }

  .clip-body { padding: 1.25rem; }

  .clip-title {
    font-weight: 600;
    margin-bottom: 0.5rem;
    font-size: 1rem;
  }

  .clip-meta {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .clip-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
    transition: all 0.3s;
    font-family: inherit;
  }

  .clip-input:focus {
    outline: none;
    border-color: var(--fire2);
    box-shadow: 0 0 0 3px rgba(255, 61, 0, 0.08);
  }

  .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

  .btn {
    padding: 0.6rem 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: all 0.3s;
    font-family: inherit;
  }

  .btn-primary {
    background: var(--gradient);
    color: white;
    box-shadow: 0 4px 16px rgba(255, 61, 0, 0.25);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 61, 0, 0.4);
  }

  .btn-secondary {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--fire2);
    color: var(--fire3);
  }

  .btn-danger {
    background: var(--error);
    color: white;
  }

  .btn-danger:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }

  .btn-sm {
    padding: 0.4rem 0.75rem;
    font-size: 0.8rem;
  }

  /* Responsive */
  @media (max-width: 768px) {
    header { padding: 1rem; flex-wrap: wrap; gap: 0.75rem; }
    .container { padding: 1rem; }
    .clips-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app-grain" aria-hidden="true"></div>
<header>
  <div class="logo">
    <div class="logo-icon">C</div>
    <span>ClipForge</span>
  </div>
  <div class="header-actions">
    <a href="/meme-sounds" class="btn btn-secondary btn-sm" style="color: var(--fire3); text-decoration: none;">Meme Sounds</a>
    <a href="/publish" class="btn btn-secondary btn-sm" style="color: var(--fire3); text-decoration: none;">Publish</a>
    <button class="btn btn-primary btn-sm" onclick="saveClips()">Save Changes</button>
  </div>
</header>
<div class="container">
  <div class="status" id="status">Loading clips...</div>
  <div class="clips-grid" id="clips"></div>
</div>
<script>
  const API = document.querySelector('meta[name="clipforge-api-base"]')?.content || '/api';
  let token = localStorage.getItem('clipforge_token');
  let user = JSON.parse(localStorage.getItem('clipforge_user') || 'null');
  const urlParams = new URLSearchParams(window.location.search);
  let clipId = urlParams.get('clip');
  let clips = [];
  let currentProjectId = urlParams.get('project');

  async function loadClips() {
    if (!currentProjectId) {
      document.getElementById('status').textContent = 'No project selected';
      return;
    }
    const res = await fetch(`${API}/projects/${currentProjectId}/clips`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) { document.getElementById('status').textContent = 'Failed to load clips'; return; }
    const data = await res.json();
    clips = data.clips || [];
    renderClips();
  }

  function renderClips() {
    const grid = document.getElementById('clips');
    grid.innerHTML = '';
    if (!clips.length) { document.getElementById('status').textContent = 'No clips found'; return; }
    document.getElementById('status').textContent = `${clips.length} clips loaded. Edit below, then save.`;
    clips.forEach((clip, i) => {
      const card = document.createElement('div');
      card.className = 'clip-card';
      card.innerHTML = `
        <img class="clip-thumb" src="/output/${jobId}/clips/clip-${String(i + 1).padStart(2, '0')}.jpg" alt="thumbnail">
        <div class="clip-body">
          <div class="clip-title">Clip ${i + 1}</div>
          <div class="clip-meta">${clip.start?.toFixed(1)}s - ${clip.end?.toFixed(1)}s · Score: ${clip.score || '—'}</div>
          <input class="clip-input" data-i="${i}" data-field="title" value="${escapeHtml(clip.title || '')}" placeholder="Title">
          <input class="clip-input" data-i="${i}" data-field="hook" value="${escapeHtml(clip.hook || '')}" placeholder="Hook">
          <input class="clip-input" data-i="${i}" data-field="start" type="number" step="0.1" value="${clip.start || 0}" placeholder="Start (s)">
          <input class="clip-input" data-i="${i}" data-field="end" type="number" step="0.1" value="${clip.end || 0}" placeholder="End (s)">
          <div class="actions">
            <button class="btn btn-danger" onclick="deleteClip(${i})">Delete</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed;bottom:2rem;right:2rem;background:rgba(26,15,10,0.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.055);border-radius:12px;padding:1rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.5);z-index:4000;color:#f5ebe0;font-size:0.9rem;border-left:4px solid ${type === 'error' ? '#ef4444' : type === 'success' ? '#10b981' : '#ff6a00'};`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  async function saveClips() {
    document.querySelectorAll('.clip-input').forEach(el => {
      const i = parseInt(el.dataset.i);
      const field = el.dataset.field;
      if (field === 'start' || field === 'end') {
        clips[i][field] = parseFloat(el.value) || clips[i][field];
      } else {
        clips[i][field] = el.value;
      }
    });
    
    for (const clip of clips) {
      await fetch(`${API}/clips/${clip.id}`, {
        method: 'PATCH',
        headers: { 
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(clip),
      });
    }
    
    document.getElementById('status').textContent = 'Saved! Re-render to apply changes.';
  }

  async function deleteClip(clipId) {
    if (!confirm('Delete this clip?')) return;
    const res = await fetch(`${API}/clips/${clipId}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.ok) {
      clips = clips.filter(c => c.id !== clipId);
      renderClips();
      showToast('Clip deleted');
    }
  }

  loadClips();
</script>
</body>
</html>
