<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — ClipForge</title>
<link rel="icon" href="/app/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main id="page">
  <div class="page-head">
    <div><h1>Projects</h1><p>A project holds one source video, the clips found in it, and everything you publish from them.</p></div>
    <div class="row"><input class="input" id="search" placeholder="Filter projects…" style="width:220px" hidden><button class="btn btn--primary" id="newBtn">New project</button></div>
  </div>
  <div class="grid grid--cards" id="list"><div class="empty small">Loading…</div></div>
</main>

<script src="/app/app.js"></script>
<script>
(async () => {
  const shell = CF.mount({ active: 'projects', title: 'Projects', actions: [{ label: 'New project', kind: 'primary', onClick: () => openCreate() }] });
  if (!shell) return;
  const $ = id => document.getElementById(id);
  let projects = [];

  const STEP_INDEX = { created: 0, uploaded: 1, analyzing: 1, analyzed: 2, clips_ready: 2, rendering: 3, rendered: 3, published: 4 };
  function card(p) {
    const step = STEP_INDEX[p.status] ?? 0;
    const steps = ['Source', 'Analysed', 'Rendered', 'Published'].map((s, i) => `<span class="step ${step > i ? 'is-done' : step === i ? 'is-now' : ''}">${s}</span>`).join('');
    return `<a class="card" href="/project.html?id=${encodeURIComponent(p.id)}">
      <div class="row row--between"><h3>${CF.esc(p.name)}</h3>${CF.badge(p.status)}</div>
      <p class="small muted" style="margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.sourceType === 'upload' ? 'Uploaded video' : CF.esc(p.sourceUrl || 'No source yet')}</p>
      <div class="steps" style="margin-top:14px">${steps}</div>
      <div class="meta-row small muted"><span>${p.clipsCount || 0} clips</span><span>${p.rendersCount || 0} rendered</span><span>Updated ${CF.fmt.ago(p.updatedAt)}</span></div>
      ${p.error ? `<p class="small" style="color:var(--bad);margin-top:10px">${CF.esc(p.error)}</p>` : ''}
    </a>`;
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const shown = projects.filter(p => !q || p.name.toLowerCase().includes(q));
    $('search').hidden = projects.length < 4;
    $('list').innerHTML = projects.length ? (shown.map(card).join('') || `<div class="empty" style="grid-column:1/-1"><h3>Nothing matches “${CF.esc(q)}”</h3></div>`) :
      `<div class="empty" style="grid-column:1/-1">${CF.ICON.projects.replace('<svg', '<svg style="width:36px;height:36px;stroke:var(--fg-3);fill:none;stroke-width:1.5;margin:0 auto 14px"')}<h3>No projects yet</h3><p>Start with a YouTube link or a video file. You’ll confirm you have the rights to it, then ClipForge takes over.</p><button class="btn btn--primary" id="emptyNew">Create your first project</button></div>`;
    const b = $('emptyNew'); if (b) b.onclick = openCreate;
  }
  $('search').oninput = render;

  async function load() {
    try { projects = (await CF.api('/projects')).projects.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); render(); }
    catch (e) { $('list').innerHTML = `<div class="empty small">${CF.esc(e.message)}</div>`; }
  }

  function openCreate() {
    let file = null;
    const body = document.createElement('div');
    body.innerHTML = `
      <div class="field"><label for="cName">Project name</label><input class="input" id="cName" placeholder="Episode 12 — interview cut" maxlength="120"></div>
      <div class="field"><label>Source</label>
        <div class="tabs" style="margin-bottom:12px"><button type="button" class="tab is-active" data-src="url">Video link</button><button type="button" class="tab" data-src="upload">Upload a file</button></div>
        <input class="input" id="cUrl" placeholder="https://youtube.com/watch?v=…">
        <div class="dropzone" id="cDrop" hidden><strong>Drop a video here</strong> or click to choose<div class="small" style="margin-top:4px">MP4, MOV or WebM · up to 50 MB through the browser</div><div class="file" id="cFile"></div><input type="file" id="cInput" accept="video/*" hidden></div>
      </div>
      <label class="check"><input type="checkbox" id="cRights"><span>I own this video or have permission to process and publish it. ClipForge won’t work on content you don’t have rights to.</span></label>`;
    let src = 'url';
    body.querySelectorAll('[data-src]').forEach(t => t.onclick = () => { src = t.dataset.src; body.querySelectorAll('[data-src]').forEach(x => x.classList.toggle('is-active', x === t)); body.querySelector('#cUrl').hidden = src !== 'url'; body.querySelector('#cDrop').hidden = src !== 'upload'; });
    const drop = body.querySelector('#cDrop'), input = body.querySelector('#cInput');
    const pick = f => { if (!f) return; if (f.size > 50 * 1024 * 1024) return CF.toast('That file is over 50 MB. Use a video link instead.', 'error'); file = f; body.querySelector('#cFile').textContent = `${f.name} · ${(f.size / 1048576).toFixed(1)} MB`; };
    drop.onclick = () => input.click(); input.onchange = () => pick(input.files[0]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('is-over'); }; drop.ondragleave = () => drop.classList.remove('is-over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('is-over'); pick(e.dataTransfer.files[0]); };

    CF.modal({ title: 'New project', body, actions: [
      { label: 'Cancel' },
      { label: 'Create project', kind: 'primary', onClick: async () => {
        const name = body.querySelector('#cName').value.trim();
        const rightsConfirmed = body.querySelector('#cRights').checked;
        if (!name) throw new Error('Give the project a name');
        if (!rightsConfirmed) throw new Error('Please confirm you have the rights to this video');
        const payload = { name, sourceType: src, rightsConfirmed };
        if (src === 'url') { payload.sourceUrl = body.querySelector('#cUrl').value.trim(); if (!payload.sourceUrl) throw new Error('Paste a video link'); }
        else { if (!file) throw new Error('Choose a video file'); payload.fileName = file.name; payload.fileBuffer = Array.from(new Uint8Array(await file.arrayBuffer())); }
        const { project } = await CF.api('/projects', { method: 'POST', body: JSON.stringify(payload) });
        // The source is attached as a second step so the project exists even if the upload fails.
        if (src === 'upload' || payload.sourceUrl) {
          try { await CF.api(`/projects/${project.id}/source`, { method: 'POST', body: JSON.stringify({ sourceType: src, sourceUrl: payload.sourceUrl, fileName: payload.fileName, fileBuffer: payload.fileBuffer, rightsConfirmed }) }); }
          catch (e) { CF.toast('Project created, but the source could not be attached: ' + e.message, 'error'); }
        }
        CF.toast('Project created', 'success');
        location.href = '/project.html?id=' + encodeURIComponent(project.id);
      } },
    ] });
  }
  $('newBtn').onclick = openCreate;
  load();
})();
</script>
</body>
</html>
