<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing — ClipForge</title>
<link rel="icon" href="/app/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main id="page">
  <div class="page-head"><div><h1>Billing</h1><p>Plans are billed monthly through Stripe. Minutes count the total length of clips you render.</p></div><button class="btn" id="portal">Manage subscription</button></div>

  <div class="stats">
    <div class="stat"><div class="stat__v" id="sUsed">—</div><div class="stat__k meta">Minutes used</div></div>
    <div class="stat"><div class="stat__v" id="sLimit">—</div><div class="stat__k meta">Monthly limit</div></div>
    <div class="stat"><div class="stat__v" id="sClips">—</div><div class="stat__k meta">Clips created</div></div>
    <div class="stat"><div class="stat__v" id="sPlan">—</div><div class="stat__k meta">Current plan</div></div>
  </div>

  <div class="grid grid--3" id="plans"></div>
  <p class="small muted">Prices in USD. Cancel any time from “Manage subscription”; you keep your plan until the end of the period you paid for.</p>
</main>

<script src="/app/app.js"></script>
<script>
(async () => {
  const shell = CF.mount({ active: 'billing', title: 'Billing' });
  if (!shell) return;
  const $ = id => document.getElementById(id);
  const PLANS = [
    { id: 'free', name: 'Free', price: 0, minutes: 60, features: ['60 minutes of clips a month', 'AI highlight detection', 'Word-by-word captions', 'ClipForge watermark'] },
    { id: 'starter', name: 'Starter', price: 19, minutes: 150, features: ['150 minutes a month', 'No watermark', 'All caption styles', 'Direct publishing'] , popular: true },
    { id: 'pro', name: 'Pro', price: 49, minutes: 500, features: ['500 minutes a month', 'No watermark', 'Priority processing', 'Everything in Starter'] },
  ];
  let me = null;

  const flags = CF.takeQuery('success', 'canceled');
  if (flags.success) CF.toast('Payment received — thank you.', 'success');
  if (flags.canceled) CF.toast('Checkout cancelled.', 'info');

  try {
    const [usage, user] = await Promise.all([CF.api('/usage'), CF.api('/auth/me')]);
    me = user;
    const unlimited = usage.minutesLimit === null || usage.minutesLimit > 1e6;
    $('sUsed').textContent = usage.minutesUsed; $('sLimit').textContent = unlimited ? '∞' : usage.minutesLimit;
    $('sClips').textContent = usage.clipsCreated; $('sPlan').textContent = CF.fmt.title(usage.plan);
  } catch (e) { CF.toast(e.message, 'error'); }

  $('plans').innerHTML = PLANS.map(p => {
    const current = me?.plan === p.id;
    return `<div class="panel" style="${p.popular ? 'border-color:rgba(255,90,43,.45)' : ''}">
      <div class="panel__body">
        <div class="row row--between"><span class="meta">${p.name}</span>${current ? '<span class="badge badge--ok">current</span>' : p.popular ? '<span class="badge badge--ember">popular</span>' : ''}</div>
        <div class="score" style="font-size:34px">$${p.price}<small> /month</small></div>
        <ul style="list-style:none;display:grid;gap:8px;font-size:13px;color:var(--fg-2)">${p.features.map(f => `<li class="row" style="gap:8px"><span style="color:var(--ok)">✓</span>${f}</li>`).join('')}</ul>
      </div>
      <div class="panel__foot" style="justify-content:stretch">${current ? '<button class="btn btn--block" disabled>Your plan</button>' : p.id === 'free' ? '<button class="btn btn--block" disabled>Downgrade via subscription</button>' : `<button class="btn btn--block ${p.popular ? 'btn--primary' : ''}" data-plan="${p.id}">Upgrade to ${p.name}</button>`}</div>
    </div>`;
  }).join('');
  $('plans').querySelectorAll('[data-plan]').forEach(b => b.onclick = async () => {
    CF.busy(b, true);
    try { const { url } = await CF.api('/stripe/checkout', { method: 'POST', body: JSON.stringify({ plan: b.dataset.plan }) }); if (url) location.href = url; else throw new Error('No checkout URL returned'); }
    catch (e) { CF.toast(e.message, 'error', 6000); CF.busy(b, false); }
  });
  $('portal').onclick = async () => {
    CF.busy($('portal'), true);
    try { const { url } = await CF.api('/stripe/portal', { method: 'POST' }); if (url) location.href = url; }
    catch (e) { CF.toast(e.message, 'error', 6000); CF.busy($('portal'), false); }
  };
})();
</script>
</body>
</html>
