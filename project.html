<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — ClipForge</title>
<link rel="icon" href="/app/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main id="page">
  <div class="page-head">
    <div><h1 id="name">Loading…</h1><p id="source" class="mono"></p></div>
    <div class="row" id="actions"></div>
  </div>

  <div class="panel">
    <div class="panel__body" style="padding:14px 18px">
      <div class="row row--between">
        <div class="steps" id="steps"></div>
        <span id="status"></span>
      </div>
      <div id="progress" hidden style="margin-top:12px"><div class="usage"><i id="progressBar" style="width:30%"></i></div><p class="small muted" id="progressText" style="margin-top:6px"></p></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat__v" id="sTotal">0</div><div class="stat__k meta">Clips</div></div>
    <div class="stat"><div class="stat__v" id="sRendered">0</div><div class="stat__k meta">Rendered</div></div>
    <div class="stat"><div class="stat__v" id="sProcessing">0</div><div class="stat__k meta">In progress</div></div>
    <div class="stat"><div class="stat__v" id="sScore">—</div><div class="stat__k meta">Avg score</div></div>
  </div>

  <section class="panel">
    <div class="panel__head"><div><h2>Clips</h2><p>Ranked by how likely each moment is to hold attention.</p></div><div class="row"><a class="btn btn--sm" id="editAll">Edit all</a><a class="btn btn--sm" id="publishAll">Publish</a></div></div>
    <div class="list" id="clips"><div class="empty small">Loading…</div></div>
  </section>
</main>

<script src="/app/app.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.replace('/projects.html'); return; }
  const shell = CF.mount({ active: 'projects', title: 'Project', crumbs: [{ label: 'Projects', href: '/projects.html' }] });
  if (!shell) return;
  const $ = q => document.getElementById(q);
  let project = null, clips = [];
  $('editAll').href = `/editor.html?project=${encodeURIComponent(id)}`;
  $('publishAll').href = `/publish.html?project=${encodeURIComponent(id)}`;

  // Where each server status sits on the Created → Source → Analysed → Rendered → Published track.
  const STAGE = { created: 0, uploaded: 1, analyzing: 1, analyzed: 2, clips_ready: 2, rendering: 3, rendered: 3, published: 4, failed: 0, error: 0 };
  function renderHeader() {
    const p = project;
    $('name').textContent = p.name; document.title = `${p.name} — ClipForge`;
    document.querySelector('.topbar__title').textContent = p.name;
    $('source').textContent = p.sourceType === 'upload' ? (p.sourceFile ? 'uploaded file' : 'no file attached yet') : (p.sourceUrl || 'no source yet');
    $('status').innerHTML = CF.badge(p.status);
    const idx = STAGE[p.status] ?? 0;
    $('steps').innerHTML = ['Created', 'Source', 'Analysed', 'Rendered', 'Published'].map((s, i) => `<span class="step ${idx > i ? 'is-done' : idx === i ? 'is-now' : ''}">${s}</span>`).join('');
    const hasSource = !!p.sourceFile;
    $('actions').innerHTML = `
      ${!hasSource ? '<button class="btn btn--primary" id="attach">Attach source</button>' : '<button class="btn" id="attach">Replace source</button>'}
      ${hasSource ? `<button class="btn btn--primary" id="analyze">${clips.length ? 'Re-analyse' : 'Analyse video'}</button>` : ''}`;
    $('attach').onclick = openAttach;
    const an = $('analyze'); if (an) an.onclick = analyze;
    if (p.error) CF.toast(p.error, 'error', 6000);
  }

  function renderClips() {
    const rendered = clips.filter(c => c.renderStatus === 'done').length;
    const busy = clips.filter(c => ['rendering', 'processing'].includes(c.renderStatus || c.status)).length;
    const scores = clips.map(c => c.score).filter(s => s != null);
    $('sTotal').textContent = clips.length; $('sRendered').textContent = rendered; $('sProcessing').textContent = busy;
    $('sScore').textContent = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '—';
    $('editAll').hidden = $('publishAll').hidden = !clips.length;
    if (!clips.length) {
      $('clips').innerHTML = `<div class="empty"><h3>No clips yet</h3><p>${project?.sourceFile ? 'Analyse the video to find its best moments.' : 'Attach a source video first, then analyse it.'}</p></div>`;
      return;
    }
    $('clips').innerHTML = clips.map((c, i) => `
      <div class="clip">
        <div class="clip__thumb">${c.renderPath ? `<video src="${CF.esc(c.renderPath)}" preload="metadata" muted playsinline></video>` : '<svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"/></svg>'}</div>
        <div>
          <div class="clip__title">${CF.esc(c.title || 'Clip ' + (i + 1))}</div>
          <div class="clip__hook">${CF.esc(c.hook || c.reason || '')}</div>
          <div class="clip__meta"><span class="mono muted">${CF.fmt.secs(c.start)} → ${CF.fmt.secs(c.end)}</span>${CF.badge(c.renderStatus || 'pending')}${c.error ? `<span class="small" style="color:var(--bad)">${CF.esc(c.error)}</span>` : ''}</div>
        </div>
        <div class="clip__side">
          <span class="score">${c.score ?? '—'}<small> /100</small></span>
          <div class="item__actions">
            ${c.renderPath ? `<a class="btn btn--sm" download href="${CF.esc(c.renderPath)}">Download</a>` : ''}
            <button class="btn btn--sm ${c.renderStatus === 'done' ? '' : 'btn--primary'}" data-render="${c.id}">${c.renderStatus === 'done' ? 'Re-render' : 'Render'}</button>
            <a class="btn btn--ghost btn--sm" href="/editor.html?project=${encodeURIComponent(id)}&clip=${encodeURIComponent(c.id)}">Edit</a>
            <button class="btn btn--ghost btn--sm" data-delete="${c.id}" aria-label="Delete clip">✕</button>
          </div>
        </div>
      </div>`).join('');
    $('clips').querySelectorAll('[data-render]').forEach(b => b.onclick = () => renderClip(b.dataset.render, b));
    $('clips').querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteClip(b.dataset.delete));
  }

  async function load() {
    try {
      project = (await CF.api(`/projects/${id}`)).project;
      clips = (await CF.api(`/projects/${id}/clips`)).clips || [];
      renderHeader(); renderClips();
    } catch (e) { CF.toast(e.message, 'error'); $('name').textContent = 'Project not found'; $('clips').innerHTML = `<div class="empty small">${CF.esc(e.message)}</div>`; }
  }

  function openAttach() {
    let file = null, src = project.sourceType === 'upload' ? 'upload' : 'url';
    const body = document.createElement('div');
    body.innerHTML = `
      <div class="tabs" style="margin-bottom:12px"><button type="button" class="tab" data-src="url">Video link</button><button type="button" class="tab" data-src="upload">Upload a file</button></div>
      <input class="input" id="aUrl" placeholder="Paste a link from YouTube, TikTok, Instagram, VK, Google Drive, or a direct video URL" value="${CF.esc(project.sourceUrl || '')}">
      <div class="dropzone" id="aDrop" hidden><strong>Drop a video here</strong> or click to choose<div class="file" id="aFile"></div><input type="file" id="aInput" accept="video/*" hidden></div>
      <label class="check" style="margin-top:14px"><input type="checkbox" id="aRights"><span>I own this video or have permission to process and publish it.</span></label>`;
    const sync = () => { body.querySelectorAll('[data-src]').forEach(x => x.classList.toggle('is-active', x.dataset.src === src)); body.querySelector('#aUrl').hidden = src !== 'url'; body.querySelector('#aDrop').hidden = src !== 'upload'; };
    body.querySelectorAll('[data-src]').forEach(t => t.onclick = () => { src = t.dataset.src; sync(); }); sync();
    const drop = body.querySelector('#aDrop'), input = body.querySelector('#aInput');
    const pick = f => { if (!f) return; if (f.size > 50 * 1024 * 1024) return CF.toast('That file is over 50 MB. Use a video link instead.', 'error'); file = f; body.querySelector('#aFile').textContent = `${f.name} · ${(f.size / 1048576).toFixed(1)} MB`; };
    drop.onclick = () => input.click(); input.onchange = () => pick(input.files[0]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('is-over'); }; drop.ondragleave = () => drop.classList.remove('is-over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('is-over'); pick(e.dataTransfer.files[0]); };
    CF.modal({ title: 'Source video', body, actions: [{ label: 'Cancel' }, { label: 'Attach', kind: 'primary', onClick: async () => {
      if (!body.querySelector('#aRights').checked) throw new Error('Please confirm you have the rights to this video');
      const payload = { sourceType: src, rightsConfirmed: true };
      if (src === 'url') { payload.sourceUrl = body.querySelector('#aUrl').value.trim(); if (!payload.sourceUrl) throw new Error('Paste a video link'); }
      else { if (!file) throw new Error('Choose a video file'); payload.fileName = file.name; payload.fileBuffer = Array.from(new Uint8Array(await file.arrayBuffer())); }
      await CF.api(`/projects/${id}/source`, { method: 'POST', body: JSON.stringify(payload) });
      CF.toast('Source attached', 'success'); load();
    } }] });
  }

  async function analyze() {
    const btn = $('analyze'); CF.busy(btn, true);
    $('progress').hidden = false; $('progressText').textContent = 'Transcribing and scoring moments — this can take a few minutes for long videos.';
    $('progressBar').style.width = '35%';
    try { await CF.api(`/projects/${id}/analyze`, { method: 'POST' }); $('progressBar').style.width = '100%'; $('progressText').textContent = 'Analysis complete.'; CF.toast('Analysis complete', 'success'); }
    catch (e) { CF.toast(e.message, 'error', 6000); $('progressText').textContent = e.message; }
    finally { CF.busy(btn, false); setTimeout(() => { $('progress').hidden = true; }, 1500); load(); }
  }

  async function renderClip(clipId, btn) {
    CF.busy(btn, true);
    try { await CF.api(`/clips/${clipId}/render`, { method: 'POST' }); CF.toast('Clip rendered', 'success'); }
    catch (e) { CF.toast(e.message, 'error', 6000); }
    finally { load(); }
  }
  async function deleteClip(clipId) {
    if (!await CF.confirm('Delete this clip? Its rendered video is removed too.', { label: 'Delete' })) return;
    try { await CF.api(`/clips/${clipId}`, { method: 'DELETE' }); CF.toast('Clip deleted', 'success'); load(); }
    catch (e) { CF.toast(e.message, 'error'); }
  }
  load();
})();
</script>
</body>
</html>
