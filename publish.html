<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipForge — Publishing Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #06040a;
    --bg2: #0d0806;
    --panel: #1a0f0a;
    --panel2: #241610;
    --text: #f5ebe0;
    --text2: #d4c4b5;
    --muted: #8a7a6e;
    --fire: #ff3d00;
    --fire2: #ff6a00;
    --fire3: #ff9d00;
    --fire4: #ffd166;
    --border: rgba(255, 255, 255, 0.055);
    --border2: rgba(255, 255, 255, 0.09);
    --gradient: linear-gradient(135deg, #ff3d00 0%, #ff6a00 100%);
    --gradient2: linear-gradient(135deg, #ff6a00 0%, #ff9d00 100%);
    --success: #10b981;
    --error: #ef4444;
    --radius: 12px;
    --shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app-grain {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(6, 4, 10, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--gradient);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: white;
    font-weight: 800;
  }

  h1 { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }

  .container {
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section { margin-bottom: 2.5rem; }
  .section h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: -0.01em; }

  .accounts {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }

  .account-card {
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s;
  }

  .account-card:hover {
    border-color: var(--fire2);
    transform: translateX(4px);
  }

  .account-info h3 { margin: 0 0 0.25rem 0; font-size: 1rem; font-weight: 600; }
  .account-info p { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .connected { color: var(--success) !important; }
  .disconnected { color: var(--error) !important; }

  .btn {
    padding: 0.6rem 1.25rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: all 0.3s;
    font-family: inherit;
  }

  .btn-primary {
    background: var(--gradient);
    color: white;
    box-shadow: 0 4px 16px rgba(255, 61, 0, 0.25);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 61, 0, 0.4);
  }

  .btn-success {
    background: var(--success);
    color: white;
  }

  .btn-success:hover { opacity: 0.9; transform: translateY(-2px); }

  .btn-danger {
    background: var(--error);
    color: white;
  }

  .btn-danger:hover { opacity: 0.9; transform: translateY(-2px); }

  .clips-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .clip-card {
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.3s;
  }

  .clip-card:hover {
    border-color: var(--fire2);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(255, 61, 0, 0.1);
  }

  .clip-thumb {
    width: 100%;
    aspect-ratio: 9/16;
    object-fit: cover;
    background: #000;
    display: block;
  }

  .clip-body { padding: 1.25rem; }
  .clip-title { font-weight: 600; margin-bottom: 0.5rem; font-size: 1rem; }
  .clip-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }

  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  /* Responsive */
  @media (max-width: 768px) {
    header { padding: 1rem; flex-wrap: wrap; gap: 0.75rem; }
    .container { padding: 1rem; }
    .accounts { grid-template-columns: 1fr; }
    .clips-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app-grain" aria-hidden="true"></div>
<header>
  <div class="logo">
    <div class="logo-icon">C</div>
    <span>ClipForge</span>
  </div>
  <button class="btn btn-primary" onclick="publishAll()">Publish All Clips</button>
</header>
<div class="container">
  <div class="section">
    <h2>Connected Accounts</h2>
    <div class="accounts" id="accounts"></div>
  </div>
  <div class="section">
    <h2>Clips</h2>
    <div class="clips-grid" id="clips"></div>
  </div>
</div>
<script>
  const jobId = new URLSearchParams(window.location.search).get('job') || 'video';
  let clips = [];
  let social = {};

  async function loadData() {
    await Promise.all([loadClips(), loadSocial()]);
    renderAccounts();
    renderClips();
  }

  async function loadClips() {
    const res = await fetch(`/api/clips/${jobId}`);
    if (!res.ok) return;
    const data = await res.json();
    clips = data.clips || [];
  }

  async function loadSocial() {
    const token = localStorage.getItem('clipforge_token');
    if (!token) return;
    const res = await fetch('/api/auth/social', {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) return;
    const data = await res.json();
    social = data.social || {};
  }

  function renderAccounts() {
    const platforms = ['youtube', 'tiktok', 'instagram'];
    const container = document.getElementById('accounts');
    container.innerHTML = platforms.map(p => {
      const connected = !!social[p];
      return `
        <div class="account-card">
          <div class="account-info">
            <h3>${p.charAt(0).toUpperCase() + p.slice(1)}</h3>
            <p class="${connected ? 'connected' : 'disconnected'}">${connected ? 'Connected' : 'Not connected'}</p>
          </div>
          ${connected 
            ? `<button class="btn btn-danger btn-sm" onclick="disconnect('${p}')">Disconnect</button>`
            : `<button class="btn btn-primary btn-sm" onclick="connect('${p}')">Connect</button>`
          }
        </div>
      `;
    }).join('');
  }

  function renderClips() {
    const container = document.getElementById('clips');
    container.innerHTML = clips.map((clip, i) => `
      <div class="clip-card">
        <img class="clip-thumb" src="/output/${jobId}/clips/clip-${String(i + 1).padStart(2, '0')}.jpg" alt="thumbnail">
        <div class="clip-body">
          <div class="clip-title">${escapeHtml(clip.title || 'Clip ' + (i + 1))}</div>
          <div class="clip-meta">${clip.start?.toFixed(1)}s - ${clip.end?.toFixed(1)}s</div>
          <div class="actions">
            <button class="btn btn-primary btn-sm" onclick="publish(${i}, 'youtube')">YouTube</button>
            <button class="btn btn-primary btn-sm" onclick="publish(${i}, 'tiktok')">TikTok</button>
            <button class="btn btn-primary btn-sm" onclick="publish(${i}, 'instagram')">Instagram</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function connect(platform) {
    const res = await fetch(`/api/auth/${platform}/url`);
    const data = await res.json();
    if (data.url) window.open(data.url, '_blank');
  }

  async function disconnect(platform) {
    const token = localStorage.getItem('clipforge_token');
    await fetch(`/api/auth/${platform}/disconnect`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` },
    });
    loadData();
  }

  async function publish(i, platform) {
    const token = localStorage.getItem('clipforge_token');
    await fetch(`/api/publish/${jobId}/${i}/${platform}`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` },
    });
    showToast('Published to ' + platform);
  }

  function publishAll() {
    clips.forEach((_, i) => {
      ['youtube', 'tiktok', 'instagram'].forEach(p => publish(i, p));
    });
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:2rem;right:2rem;background:rgba(26,15,10,0.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.055);border-radius:12px;padding:1rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.5);z-index:4000;color:#f5ebe0;font-size:0.9rem;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  loadData();
</script>
</body>
</html>
