<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip editor — ClipForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main id="page">
  <div class="page-head"><div><h1>Clip editor</h1><p>Tighten titles, hooks and in/out points. Save, then re-render the clips you changed.</p></div><span class="badge" id="state">loading</span></div>
  <div class="panel"><div class="list" id="clips"><div class="empty small">Loading…</div></div></div>
</main>

<script src="/app/app.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const projectId = q.get('project'), focus = q.get('clip');
  const shell = CF.mount({ active: 'projects', title: 'Clip editor', crumbs: [{ label: 'Projects', href: '/projects.html' }, ...(projectId ? [{ label: 'Project', href: `/project.html?id=${encodeURIComponent(projectId)}` }] : [])],
    actions: [{ label: 'Save changes', kind: 'primary', id: 'save', onClick: b => save(b) }] });
  if (!shell) return;
  const $ = id => document.getElementById(id);
  let clips = [], dirty = new Set();
  const setState = (t, k) => { $('state').textContent = t; $('state').className = 'badge badge--' + k; };

  if (!projectId) { $('clips').innerHTML = '<div class="empty"><h3>No project selected</h3><p>Open a project and choose “Edit all”.</p><a class="btn btn--primary" href="/projects.html">Go to projects</a></div>'; setState('idle', 'muted'); return; }

  async function load() {
    try {
      clips = (await CF.api(`/projects/${projectId}/clips`)).clips || [];
      dirty.clear(); render(); setState(`${clips.length} clips`, 'muted');
      if (focus) { const el = document.querySelector(`[data-clip="${CSS.escape(focus)}"]`); if (el) { el.scrollIntoView({ block: 'center' }); el.querySelector('input')?.focus(); } }
    } catch (e) { $('clips').innerHTML = `<div class="empty small">${CF.esc(e.message)}</div>`; setState('error', 'bad'); }
  }

  function render() {
    if (!clips.length) { $('clips').innerHTML = '<div class="empty"><h3>No clips to edit</h3><p>Analyse the project first to generate clips.</p></div>'; return; }
    $('clips').innerHTML = clips.map((c, i) => `
      <div class="clip" data-clip="${CF.esc(c.id)}">
        <div class="clip__thumb">${c.renderPath ? `<video src="${CF.esc(c.renderPath)}" preload="metadata" muted playsinline></video>` : '<svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"/></svg>'}</div>
        <div>
          <div class="row row--between"><span class="mono muted">clip ${i + 1}</span><span class="row">${CF.badge(c.renderStatus || 'pending')}<span class="score">${c.score ?? '—'}<small> /100</small></span></span></div>
          <div class="clip__edit">
            <div class="field"><label>Title</label><input class="input" data-i="${i}" data-f="title" value="${CF.esc(c.title || '')}" placeholder="Title"></div>
            <div class="field"><label>Hook</label><input class="input" data-i="${i}" data-f="hook" value="${CF.esc(c.hook || '')}" placeholder="First line on screen"></div>
            <div class="field"><label>Start (s)</label><input class="input" data-i="${i}" data-f="start" type="number" step="0.1" min="0" value="${c.start ?? 0}"></div>
            <div class="field"><label>End (s)</label><input class="input" data-i="${i}" data-f="end" type="number" step="0.1" min="0" value="${c.end ?? 0}"></div>
          </div>
          <div class="row" style="margin-top:12px">
            <button class="btn btn--sm" data-render="${c.id}">${c.renderStatus === 'done' ? 'Re-render' : 'Render'}</button>
            <button class="btn btn--ghost btn--sm" data-delete="${c.id}">Delete</button>
          </div>
        </div>
      </div>`).join('');
    $('clips').querySelectorAll('input[data-f]').forEach(el => el.oninput = () => { dirty.add(+el.dataset.i); setState(`${dirty.size} unsaved`, 'warn'); });
    $('clips').querySelectorAll('[data-render]').forEach(b => b.onclick = () => renderClip(b.dataset.render, b));
    $('clips').querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteClip(b.dataset.delete));
  }

  function collect() {
    $('clips').querySelectorAll('input[data-f]').forEach(el => {
      const c = clips[+el.dataset.i], f = el.dataset.f;
      c[f] = (f === 'start' || f === 'end') ? (parseFloat(el.value) || 0) : el.value;
    });
  }

  async function save(btn) {
    collect();
    const bad = clips.find(c => c.end <= c.start);
    if (bad) return CF.toast(`“${bad.title || 'A clip'}” ends before it starts`, 'error');
    if (!dirty.size) return CF.toast('Nothing to save', 'info');
    CF.busy(btn, true);
    try {
      for (const i of dirty) { const c = clips[i]; await CF.api(`/clips/${c.id}`, { method: 'PATCH', body: JSON.stringify({ title: c.title, hook: c.hook, start: c.start, end: c.end }) }); }
      CF.toast(`Saved ${dirty.size} clip${dirty.size === 1 ? '' : 's'}. Re-render to apply.`, 'success'); dirty.clear(); setState('saved', 'ok');
    } catch (e) { CF.toast(e.message, 'error'); } finally { CF.busy(btn, false); }
  }
  async function renderClip(id, b) {
    if (dirty.size) { CF.toast('Save your changes first so the render uses them', 'info'); return; }
    CF.busy(b, true);
    try { await CF.api(`/clips/${id}/render`, { method: 'POST' }); CF.toast('Clip rendered', 'success'); load(); }
    catch (e) { CF.toast(e.message, 'error', 6000); CF.busy(b, false); }
  }
  async function deleteClip(id) {
    if (!await CF.confirm('Delete this clip?', { label: 'Delete' })) return;
    try { await CF.api(`/clips/${id}`, { method: 'DELETE' }); clips = clips.filter(c => c.id !== id); dirty.clear(); render(); CF.toast('Clip deleted', 'success'); }
    catch (e) { CF.toast(e.message, 'error'); }
  }
  window.addEventListener('beforeunload', e => { if (dirty.size) { e.preventDefault(); e.returnValue = ''; } });
  load();
})();
</script>
</body>
</html>
