<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipForge — Projects</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --bg: #080605;
    --bg2: #0f0a08;
    --bg3: #130a06;
    --panel: #1a0f0a;
    --panel2: #241610;
    --text: #f5ebe0;
    --text2: #d4c4b5;
    --muted: #8a7a6e;
    --fire: #ff3d00;
    --fire2: #ff6a00;
    --fire3: #ff9d00;
    --fire4: #ffd166;
    --border: rgba(255, 255, 255, 0.055);
    --border2: rgba(255, 255, 255, 0.09);
    --gradient: linear-gradient(135deg, #ff3d00 0%, #ff6a00 100%);
    --gradient2: linear-gradient(135deg, #ff6a00 0%, #ff9d00 100%);
    --success: #10b981;
    --error: #ef4444;
    --warning: #f59e0b;
    --radius: 12px;
    --shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app-grain {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 6, 5, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--gradient);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: white;
    font-weight: 800;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
  }

  .page-title {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
  }

  .btn-primary {
    background: var(--gradient);
    color: white;
    box-shadow: 0 4px 16px rgba(255, 61, 0, 0.25);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 61, 0, 0.4);
  }

  .btn-secondary {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--fire2);
    color: var(--fire3);
  }

  .project-card {
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: all 0.3s;
    cursor: pointer;
  }

  .project-card:hover {
    border-color: var(--fire2);
    transform: translateX(4px);
    box-shadow: 0 8px 32px rgba(255, 61, 0, 0.1);
  }

  .project-card h3 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  .project-card p {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--panel2);
    color: var(--text2);
    border: 1px solid var(--border);
    margin-top: 0.5rem;
  }

  .status-badge.ready { background: rgba(16, 185, 129, 0.15); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
  .status-badge.processing { background: rgba(245, 158, 11, 0.15); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
  .status-badge.error { background: rgba(239, 68, 68, 0.15); color: var(--error); border-color: rgba(239, 68, 68, 0.3); }

  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal.active { display: flex; }

  .modal-content {
    background: rgba(26, 15, 10, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 2.5rem;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
  }

  .modal-content h2 {
    margin-bottom: 1.5rem;
    font-size: 1.75rem;
    font-weight: 800;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--text2);
    font-weight: 500;
    font-size: 0.9rem;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    transition: all 0.3s;
    font-family: inherit;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--fire2);
    box-shadow: 0 0 0 3px rgba(255, 61, 0, 0.1);
  }

  .checkbox-group {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 1.25rem;
  }

  .checkbox-group input {
    width: auto;
    margin-top: 4px;
  }

  .checkbox-group label {
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
  }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }

  .empty-state h3 {
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  @media (max-width: 768px) {
    header { padding: 1rem; }
    .container { padding: 1rem; }
    .page-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="app-grain" aria-hidden="true"></div>

<header>
  <a href="/" class="logo">
    <div class="logo-icon">C</div>
    <span>ClipForge</span>
  </a>
  <div style="display: flex; gap: 1rem; align-items: center;">
    <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">Dashboard</button>
    <button class="btn btn-secondary" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Projects</h1>
    <button class="btn btn-primary" onclick="showCreateModal()">+ New Project</button>
  </div>

  <div id="projectsList"></div>
</div>

<!-- Create Project Modal -->
<div class="modal" id="createModal">
  <div class="modal-content">
    <h2>Create New Project</h2>
    <div class="form-group">
      <label>Project Name</label>
      <input type="text" id="projectName" placeholder="My video project">
    </div>
    <div class="form-group">
      <label>Source Type</label>
      <select id="sourceType" onchange="toggleSourceFields()">
        <option value="upload">Upload Video</option>
        <option value="url">YouTube URL</option>
      </select>
    </div>
    <div class="form-group" id="urlField" style="display: none;">
      <label>Video URL</label>
      <input type="text" id="sourceUrl" placeholder="https://youtube.com/watch?v=...">
    </div>
    <div class="form-group" id="uploadField">
      <label>Video File</label>
      <input type="file" id="sourceFile" accept="video/*">
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="rightsConfirmed">
      <label for="rightsConfirmed">I confirm I have the right to process and publish this content. I own this video or have permission/license to use it.</label>
    </div>
    <button class="btn btn-primary" style="width: 100%;" onclick="createProject()">Create Project</button>
    <button class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem;" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
  const API = document.querySelector('meta[name="clipforge-api-base"]')?.content || '/api';
  let token = localStorage.getItem('clipforge_token');
  let user = JSON.parse(localStorage.getItem('clipforge_user') || 'null');

  function $(id) { return document.getElementById(id); }

  function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed;bottom:2rem;right:2rem;background:rgba(26,15,10,0.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.055);border-radius:12px;padding:1rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.5);z-index:4000;color:#f5ebe0;font-size:0.9rem;border-left:4px solid ${type === 'error' ? '#ef4444' : type === 'success' ? '#10b981' : '#ff6a00'};`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: 'Bearer ' + token } : {}),
        ...(opts.headers || {}),
      },
    });
    if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error || 'Request failed');
    return data;
  }

  function showCreateModal() {
    $('createModal').classList.add('active');
  }

  function closeModal() {
    $('createModal').classList.remove('active');
  }

  function toggleSourceFields() {
    const type = $('sourceType').value;
    $('urlField').style.display = type === 'url' ? 'block' : 'none';
    $('uploadField').style.display = type === 'upload' ? 'block' : 'none';
  }

  async function createProject() {
    const name = $('projectName').value.trim();
    const sourceType = $('sourceType').value;
    const sourceUrl = $('sourceUrl').value.trim();
    const rightsConfirmed = $('rightsConfirmed').checked;

    if (!name) return showToast('Please enter a project name', 'error');
    if (!rightsConfirmed) return showToast('Please confirm rights to process this content', 'error');

    try {
      const body = { name, sourceType, rightsConfirmed };
      if (sourceType === 'url') body.sourceUrl = sourceUrl;
      if (sourceType === 'upload') {
        const file = $('sourceFile').files[0];
        if (!file) return showToast('Please select a video file', 'error');
        const buffer = await file.arrayBuffer();
        body.fileName = file.name;
        body.fileBuffer = Array.from(new Uint8Array(buffer));
      }

      const data = await api('/projects', {
        method: 'POST',
        body: JSON.stringify(body),
      });

      showToast('Project created!', 'success');
      closeModal();
      loadProjects();
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  async function loadProjects() {
    try {
      const data = await api('/projects');
      const container = $('projectsList');
      
      if (data.projects.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No projects yet</h3>
            <p>Create your first project to start creating shorts</p>
          </div>
        `;
        return;
      }

      container.innerHTML = data.projects.map(p => `
        <div class="project-card" onclick="window.location.href='/project.html?id=${p.id}'">
          <h3>${escapeHtml(p.name)}</h3>
          <p>${p.sourceType === 'upload' ? 'Uploaded video' : p.sourceUrl || 'No source'}</p>
          <span class="status-badge ${p.status}">${p.status}</span>
        </div>
      `).join('');
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function logout() {
    token = null;
    user = null;
    localStorage.removeItem('clipforge_token');
    localStorage.removeItem('clipforge_user');
    window.location.href = '/';
  }

  // Init
  if (!token) {
    window.location.href = '/';
  }
  loadProjects();
</script>
</body>
</html>
