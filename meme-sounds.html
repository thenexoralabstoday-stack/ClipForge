<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipForge — Meme Sound Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #06040a;
    --bg2: #0d0806;
    --panel: #1a0f0a;
    --panel2: #241610;
    --text: #f5ebe0;
    --text2: #d4c4b5;
    --muted: #8a7a6e;
    --fire: #ff3d00;
    --fire2: #ff6a00;
    --fire3: #ff9d00;
    --fire4: #ffd166;
    --border: rgba(255, 255, 255, 0.055);
    --border2: rgba(255, 255, 255, 0.09);
    --gradient: linear-gradient(135deg, #ff3d00 0%, #ff6a00 100%);
    --gradient2: linear-gradient(135deg, #ff6a00 0%, #ff9d00 100%);
    --success: #10b981;
    --error: #ef4444;
    --radius: 12px;
    --shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app-grain {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(6, 4, 10, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.25rem;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--gradient);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: white;
    font-weight: 800;
  }

  h1 { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }

  .container {
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section { margin-bottom: 2.5rem; }
  .section h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: -0.01em; }

  .status {
    padding: 1rem 1.25rem;
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
    color: var(--text2);
  }

  .sounds-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
  }

  .sound-card {
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
  }

  .sound-card:hover {
    border-color: var(--fire2);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(255, 61, 0, 0.1);
  }

  .sound-card.selected {
    border-color: var(--fire);
    background: rgba(255, 61, 0, 0.08);
    box-shadow: 0 0 20px rgba(255, 61, 0, 0.15);
  }

  .sound-name { font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
  .sound-tags { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.75rem; }
  .sound-duration { font-size: 0.8rem; color: var(--muted); }

  .clips-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .clip-card {
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.3s;
  }

  .clip-card:hover {
    border-color: var(--fire2);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(255, 61, 0, 0.1);
  }

  .clip-thumb {
    width: 100%;
    aspect-ratio: 9/16;
    object-fit: cover;
    background: #000;
    display: block;
  }

  .clip-body { padding: 1.25rem; }
  .clip-title { font-weight: 600; margin-bottom: 0.5rem; font-size: 1rem; }
  .clip-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }

  .moments-list {
    margin-top: 0.75rem;
    max-height: 200px;
    overflow-y: auto;
  }

  .moment-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0.75rem;
    background: var(--bg);
    border-radius: 8px;
    margin-bottom: 0.5rem;
    font-size: 0.8rem;
  }

  .moment-time { color: var(--fire3); font-weight: 600; }
  .moment-reason { flex: 1; margin-left: 0.75rem; color: var(--muted); }
  .moment-sound {
    padding: 0.25rem 0.75rem;
    background: var(--fire);
    border-radius: 6px;
    font-size: 0.75rem;
    cursor: pointer;
    color: white;
    font-weight: 600;
    transition: all 0.3s;
    border: none;
  }

  .moment-sound:hover { background: var(--fire2); }

  .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

  .btn {
    padding: 0.6rem 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    transition: all 0.3s;
    font-family: inherit;
  }

  .btn-primary {
    background: var(--gradient);
    color: white;
    box-shadow: 0 4px 16px rgba(255, 61, 0, 0.25);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 61, 0, 0.4);
  }

  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { opacity: 0.9; transform: translateY(-2px); }

  .btn-danger { background: var(--error); color: white; }
  .btn-danger:hover { opacity: 0.9; transform: translateY(-2px); }

  .preview-section {
    margin-top: 1.5rem;
    padding: 1.5rem;
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .preview-section h3 { margin-top: 0; font-size: 1rem; font-weight: 700; }

  .example-video {
    margin-top: 2rem;
    padding: 1.5rem;
    background: rgba(26, 15, 10, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .example-video h3 { margin-top: 0; font-size: 1rem; font-weight: 700; }

  input[type="range"] {
    width: 100%;
    margin: 0.5rem 0;
    accent-color: var(--fire2);
  }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  .volume-control label { font-size: 0.8rem; color: var(--muted); min-width: 60px; }
  .volume-control input { flex: 1; }

  /* Responsive */
  @media (max-width: 768px) {
    header { padding: 1rem; flex-wrap: wrap; gap: 0.75rem; }
    .container { padding: 1rem; }
    .sounds-grid { grid-template-columns: repeat(2, 1fr); }
    .clips-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app-grain" aria-hidden="true"></div>
<header>
  <div class="logo">
    <div class="logo-icon">C</div>
    <span>ClipForge</span>
  </div>
  <button class="btn btn-primary" onclick="applyAllSounds()">Apply All Sounds</button>
</header>
<div class="container">
  <div class="status" id="status">Loading meme sounds...</div>
  
  <div class="section">
    <h2>Available Meme Sounds</h2>
    <div class="sounds-grid" id="sounds"></div>
  </div>
  
  <div class="section">
    <h2>AI-Suggested Moments</h2>
    <button class="btn btn-primary" onclick="analyzeMoments()" style="margin-bottom: 1rem;">Analyze Video for Meme Moments</button>
    <div class="clips-grid" id="clips"></div>
  </div>
  
  <div class="example-video">
    <h3>Example: Recent Video Analysis</h3>
    <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem;">
      This shows how meme sounds would be applied to the recent Minecraft video. 
      The AI detected tension peaks, surprise moments, and funny reactions.
    </p>
    <button class="btn btn-primary" onclick="loadExample()">Load Example Analysis</button>
    <div id="example-content" style="margin-top: 1.5rem;"></div>
  </div>
</div>

<script>
  const jobId = new URLSearchParams(window.location.search).get('job') || 'video';
  let clips = [];
  let memeSounds = [];
  let selectedSounds = new Set();
  let clipMoments = {};

  async function loadMemeSounds() {
    const res = await fetch('/api/meme-sounds');
    const data = await res.json();
    memeSounds = data.sounds || [];
    renderSounds();
  }

  function renderSounds() {
    const grid = document.getElementById('sounds');
    grid.innerHTML = memeSounds.map((sound, i) => `
      <div class="sound-card ${selectedSounds.has(i) ? 'selected' : ''}" onclick="toggleSound(${i})">
        <div class="sound-name">${escapeHtml(sound.name)}</div>
        <div class="sound-tags">${(sound.tags || []).map(t => '#' + escapeHtml(t)).join(' ')}</div>
        <div class="sound-duration">${sound.duration || '0:00'}</div>
      </div>
    `).join('');
  }

  function toggleSound(i) {
    if (selectedSounds.has(i)) {
      selectedSounds.delete(i);
    } else {
      selectedSounds.add(i);
    }
    renderSounds();
  }

  async function analyzeMoments() {
    document.getElementById('status').textContent = 'Analyzing video for meme moments...';
    try {
      const res = await fetch(`/api/meme-sounds/analyze/${jobId}`, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + localStorage.getItem('clipforge_token') },
      });
      const data = await res.json();
      clipMoments = data.moments || {};
      renderMoments();
      document.getElementById('status').textContent = `Found ${Object.keys(clipMoments).length} clips with meme potential.`;
    } catch (e) {
      document.getElementById('status').textContent = 'Analysis failed: ' + e.message;
    }
  }

  function renderMoments() {
    const grid = document.getElementById('clips');
    grid.innerHTML = Object.entries(clipMoments).map(([clipIdx, moments]) => `
      <div class="clip-card">
        <img class="clip-thumb" src="/output/${jobId}/clips/clip-${String(parseInt(clipIdx) + 1).padStart(2, '0')}.jpg" alt="thumbnail">
        <div class="clip-body">
          <div class="clip-title">Clip ${parseInt(clipIdx) + 1}</div>
          <div class="clip-meta">${moments.length} meme moments detected</div>
          <div class="moments-list">
            ${moments.map((m, i) => `
              <div class="moment-item">
                <span class="moment-time">${m.time}s</span>
                <span class="moment-reason">${escapeHtml(m.reason || '')}</span>
                <button class="moment-sound" onclick="applySound(${clipIdx}, ${i})">Apply</button>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `).join('');
  }

  function applySound(clipIdx, momentIdx) {
    const soundIdx = Array.from(selectedSounds)[0];
    if (soundIdx === undefined) {
      showToast('Select a sound first', 'error');
      return;
    }
    const sound = memeSounds[soundIdx];
    showToast(`Applying "${sound.name}" to clip ${parseInt(clipIdx) + 1} at ${clipMoments[clipIdx][momentIdx].time}s`);
  }

  function loadExample() {
    const example = {
      moments: {
        '0': [
          { time: 2.5, reason: 'Tension peak - perfect for dramatic sound' },
          { time: 8.3, reason: 'Surprise moment - unexpected event' },
        ],
        '1': [
          { time: 1.2, reason: 'Funny reaction - laughter audio fits' },
          { time: 5.7, reason: 'Build up - crescendo sound effect' },
        ],
      }
    };
    clipMoments = example.moments;
    renderMoments();
    document.getElementById('status').textContent = 'Example analysis loaded. Select a sound and click Apply.';
  }

  function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed;bottom:2rem;right:2rem;background:rgba(26,15,10,0.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.055);border-radius:12px;padding:1rem 1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.5);z-index:4000;color:#f5ebe0;font-size:0.9rem;border-left:4px solid ${type === 'error' ? '#ef4444' : '#ff6a00'};`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function applyAllSounds() {
    if (!selectedSounds.size) {
      showToast('Select sounds first', 'error');
      return;
    }
    showToast('Applying sounds to all clips...');
  }

  loadMemeSounds();
</script>
</body>
</html>
